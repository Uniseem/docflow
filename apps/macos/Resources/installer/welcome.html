<body>
<h1>DocFlow</h1>
<p>把 PDF、Word、PowerPoint、Excel、图片和网页翻译成简体中文，并把源文件、译文、PDF 和处理记录保存在本机文档库中。</p>
<p>安装程序会把“DocFlow”放到“应用程序”文件夹，已安装的旧版本会被替换，文档库和设置不受影响。</p>
<p>需要 macOS 14 或更新版本，安装约占用 1.3 GB。</p>
</body>

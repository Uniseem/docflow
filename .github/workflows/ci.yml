# 持续集成：推送 main、PR 与手动触发时，先在 ubuntu 上跑 npm run check（类型检查、lint、
# 单元测试）；通过后在 Windows 与 macOS 上各打一次目录包（electron-builder --dir）并跑
# Playwright E2E。只做冒烟，不上传安装包，也不上传测试报告。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查（typecheck · lint · 单测）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: 打包冒烟（${{ matrix.os }}）
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: electron-builder（只打目录，不做安装包）
        run: npx electron-builder --dir --publish never
      - name: E2E（Playwright 驱动打包后的应用）
        run: npm run test:e2e

name: Desktop apps

on:
  push:
    branches: [main]
    # A version tag (v3.0.1) also publishes the installers as a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Signing is optional. Without these secrets macOS gets an unsigned installer
# package (installed from Terminal it needs no approval; the installed app
# opens directly) and Windows an unsigned setup program.
#   macOS:   MACOS_CERTIFICATE_P12 (base64 of a .p12 with the Developer ID
#            Application and Developer ID Installer certificates),
#            MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, MACOS_INSTALLER_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (for notarization)
#   Windows: WINDOWS_CERTIFICATE_PFX (base64), WINDOWS_CERTIFICATE_PASSWORD

jobs:
  # The bundled Python runtime is built on the app's own minimum macOS, and
  # separately from the app, because the two want different machines: pip
  # picks the newest wheel tag the build Mac supports, and some wheels of the
  # pinned versions (orjson's arm64 one, for example) need macOS 15, so a
  # build on a newer system would ship binaries that cannot be imported on
  # macOS 14 — the build checks every binary's minimum and fails if one is
  # too new. The app, in the job below, needs a newer Xcode than the macOS 14
  # image carries. The Intel runtime needs a real Intel runner: under Rosetta
  # some wheels' vector instructions (AVX) stop its tests with SIGILL.
  macos-runtime:
    name: macOS runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: runtime/cache
          key: runtime-macos-${{ matrix.arch }}-${{ hashFiles('runtime/build-macos.sh', 'engine/native-pdf/requirements.txt', 'engine/native-pdf/prepare_assets.py', 'engine/native-pdf/asset_bundle.py') }}
      - name: Python + BabelDOC runtime
        run: bash runtime/build-macos.sh ${{ matrix.arch }}
      # A tarball, so the symlinks and permissions of the runtime survive the
      # trip; it is already compressed, hence compression-level 0.
      - name: Pack the runtime
        run: tar -czf runtime-macos-${{ matrix.arch }}.tar.gz -C runtime/build/macos-${{ matrix.arch }} resources
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-${{ matrix.arch }}
          path: runtime-macos-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: macos-runtime
    # Built with the newest Xcode on the runner, whose macOS 26 SDK is what
    # gives the app its Liquid Glass interface; the app still runs on macOS
    # 14, where it falls back to the earlier look. The runtime it bundles
    # comes from the job above.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on this runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i -E 'beta|_rc' | sort -V | tail -n 1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-macos-${{ matrix.arch }}
      # build.sh builds the runtime itself when it is missing, which on this
      # runner would ship wheels that need a newer macOS than 14.0; the check
      # stops that with a clear error instead.
      - name: Unpack the runtime
        run: |
          mkdir -p runtime/build/macos-${{ matrix.arch }}
          tar -xzf runtime-macos-${{ matrix.arch }}.tar.gz -C runtime/build/macos-${{ matrix.arch }}
          rm -f runtime-macos-${{ matrix.arch }}.tar.gz
          if [ ! -f runtime/build/macos-${{ matrix.arch }}/resources/pdf-assets/.ready ]; then
            echo "::error::the runtime artifact does not contain resources/pdf-assets/.ready"
            exit 1
          fi
      - name: Engine tests
        if: matrix.arch == 'arm64'
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Signing keychain
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials docflow --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "DOCFLOW_NOTARY_PROFILE=docflow" >> "$GITHUB_ENV"
          fi
          echo "DOCFLOW_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_INSTALLER_IDENTITY" ]; then
            echo "DOCFLOW_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          fi
      - name: Build DocFlow.app
        run: |
          # Unsigned builds ship only the installer package: an app installed
          # by macOS Installer is not quarantined, so it opens directly.
          if [ -n "${DOCFLOW_SIGN_IDENTITY:-}" ]; then
            bash apps/macos/build.sh --arch ${{ matrix.arch }} --pkg --dmg --zip
          else
            bash apps/macos/build.sh --arch ${{ matrix.arch }} --pkg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DocFlow-macos-${{ matrix.arch }}
          path: |
            apps/macos/dist/DocFlow-macos-${{ matrix.arch }}.pkg
            apps/macos/dist/DocFlow-macos-${{ matrix.arch }}.dmg
            apps/macos/dist/DocFlow-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      DOCFLOW_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: runtime/cache
          key: runtime-windows-x64-${{ hashFiles('runtime/build-windows.ps1', 'engine/native-pdf/requirements.txt', 'engine/native-pdf/prepare_assets.py', 'engine/native-pdf/asset_bundle.py') }}
      - name: Engine tests
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "docflow.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "DOCFLOW_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build DocFlow
        shell: pwsh
        run: ./apps/windows/build.ps1 -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: DocFlow-win-x64
          path: apps/windows/dist/DocFlow-win-x64-setup.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' engine/Cargo.toml | head -n 1)"
          windows="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' apps/windows/DocFlow/DocFlow.csproj | head -n 1)"
          manifest="$(sed -n 's/.*<assemblyIdentity version="\([^"]*\)".*/\1/p' apps/windows/DocFlow/app.manifest | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$windows" != "$version" ] || [ "$manifest" != "$version.0" ]; then
            echo "::error::tag $GITHUB_REF_NAME, engine/Cargo.toml $version, DocFlow.csproj $windows and app.manifest $manifest must agree"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: DocFlow-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/__VERSION__/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum DocFlow-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "DocFlow $VERSION" --notes-file "$RUNNER_TEMP/notes.md" DocFlow-* SHA256SUMS.txt

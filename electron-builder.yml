appId: com.uniseem.docflow
productName: DocFlow
copyright: Copyright © 2026 DocFlow contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/@napi-rs/**' # pdf.js optional native canvas; DOMMatrix is polyfilled
extraResources:
  - from: resources/fonts
    to: fonts
    filter: ['*.otf']
  - from: node_modules/pdfjs-dist/standard_fonts
    to: pdfjs/standard_fonts
  - from: node_modules/pdfjs-dist/cmaps
    to: pdfjs/cmaps
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE
asar: true
compression: normal
npmRebuild: false
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
    - target: pkg
    - target: zip
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  minimumSystemVersion: '14.0'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: PDF
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [com.adobe.pdf]
    NSHumanReadableCopyright: Copyright © 2026 DocFlow contributors
pkg:
  isRelocatable: false
  overwriteAction: upgrade
  allowAnywhere: false
  allowCurrentUserHome: false
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  fileAssociations:
    - ext: pdf
      name: PDF
      role: Viewer
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DocFlow
  deleteAppDataOnUninstall: false
  language: 2052
  installerLanguages: [zh_CN]
  runAfterFinish: true
publish: null
